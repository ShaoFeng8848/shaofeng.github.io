<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芍风科技工作室</title>
<script src="https://www.littleapple.top/js/link/no-seo-link.js"></script>
<link rel="stylesheet" href="https://shaofeng.littleapple.top/cookie/zh-cn/cookie-consent.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2b2b2b;
    background: #f7f8fa;
    line-height: 1.7;
  }
  section { min-height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px 20px; }

  /* ============ 首屏 ============ */
  .hero { overflow: hidden; color: #fff; text-align: center; }
  .hero-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; z-index: -2;
  }
  .hero-overlay {
    position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(135deg, rgba(15,23,42,.72), rgba(30,41,59,.55));
  }
  .hero-inner {
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .hero-logo {
    width: 530px; height: 84px; max-width: 88vw;
    border-radius: 20px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; letter-spacing: 1px; color: rgba(255,255,255,.75);
    backdrop-filter: blur(6px);
    box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  .hero h1 {
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 700; letter-spacing: 3px;
    text-shadow: 0 2px 18px rgba(0,0,0,.35);
  }
  .hero .sub {
    font-size: clamp(15px, 2vw, 19px);
    color: rgba(255,255,255,.86);
    font-weight: 300; letter-spacing: 1px;
  }
  .scroll-hint {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    font-size: 14px; color: rgba(255,255,255,.82);
    letter-spacing: 2px; animation: bob 2s ease-in-out infinite;
  }
  .scroll-hint::after {
    content: ""; display: block; width: 1px; height: 30px;
    margin: 10px auto 0; background: rgba(255,255,255,.5);
  }
  @keyframes bob { 0%,100%{transform:translate(-50%,0);opacity:.8} 50%{transform:translate(-50%,8px);opacity:.4} }

  /* ============ 团队 ============ */
  .team { background: #fff; }
  .team h2 {
    font-size: clamp(24px, 3.5vw, 34px); margin-bottom: 12px; color: #1f2937;
  }
  .team .lead { color: #6b7280; margin-bottom: 50px; font-size: 15px; }
  .team-grid {
    display: grid; gap: 28px; max-width: 1100px; width: 100%;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  .member {
    background: #fff; border-radius: 16px; padding: 30px 24px;
    border: 1px solid #eee; box-shadow: 0 6px 24px rgba(0,0,0,.05);
    transition: transform .3s, box-shadow .3s;
  }
  .member:hover { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(0,0,0,.1); }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    margin: 0 auto 18px; background: #eef2ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #4f46e5; font-weight: 600;
  }
  .member h3 { text-align: center; font-size: 19px; color: #111827; }
  .member .role { text-align: center; font-size: 13px; color: #6366f1; margin: 6px 0 14px; }
  .member p { font-size: 14px; color: #4b5563; text-align: center; }

  /* ============ 产品 ============ */
  .product { background-image: url('bg-product.jpg'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; }
  .product::before { content:""; position:absolute; inset:0; background: rgba(17,24,39,.8); }
  .product > * { position: relative; z-index: 1; }
  .product h2 { font-size: clamp(24px, 3.5vw, 34px); margin-bottom: 14px; }
  .product .intro { color: rgba(255,255,255,.8); max-width: 680px; text-align: center; margin-bottom: 44px; font-size: 15px; }
  .product-list { max-width: 760px; width: 100%; display: grid; gap: 14px; }
  .product-list a {
    display: block; padding: 20px 26px; border-radius: 12px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
    color: #fff; text-decoration: none; font-size: 17px;
    backdrop-filter: blur(4px); transition: background .25s, transform .25s;
  }
  .product-list a:hover { background: rgba(255,255,255,.18); transform: translateX(6px); }
  .product-list small { display:block; font-size: 13px; color: rgba(255,255,255,.65); margin-top: 4px; }

  /* ============ 社交 ============ */
  .social { background: #fff; padding-top: 40px; }
  .social h2 { font-size: clamp(22px, 3vw, 30px); margin-bottom: 34px; }
  .social-icons { display: flex; gap: 26px; }
  .social-icons a {
    width: 60px; height: 60px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: #f3f4f6; transition: transform .25s, background .25s;
  }
  .social-icons a:hover { transform: translateY(-5px); }
  .social-icons svg { width: 30px; height: 30px; }
  .icon-douyin { fill: #161823; }
  .icon-kuaishou { fill: #ff6600; }
  .icon-bili { fill: #00aeec; }

  /* ============ 备案 ============ */
  .beian {
    background: #f0f1f4; padding: 26px 20px; text-align: center;
    font-size: 13px; color: #6b7280;
  }
  .beian a { color: #4b5563; text-decoration: none; margin: 0 6px; }
  .beian a:hover { color: #111827; text-decoration: underline; }
  .gongan-icon { width: 16px; height: 16px; vertical-align: middle; margin: 0 4px; }

  @media (max-width: 600px) {
    section { padding: 60px 16px; }
    .product { background-attachment: scroll; }
  }
</style>
</head>
<body>

<!-- 首屏 -->
<section class="hero">
  <video class="hero-video" autoplay muted loop playsinline poster="">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-inner">
    <div class="hero-logo">芍风科技工作室-公司图标</div>
    <h1>芍风科技工作室</h1>
    <div class="sub">以服务为本，给用户提供最优秀的服务</div>
  </div>
  <div class="scroll-hint">向下滚动查看更多</div>
</section>

<!-- 团队 -->
<section class="team" id="team">
  <h2>团队介绍</h2>
  <p class="lead">一群认真做事的人</p>
  <div class="team-grid" id="teamGrid"></div>
  <div class="scroll-hint" style="color:#9ca3af">向下滚动查看更多</div>
</section>

<!-- 产品 -->
<section class="product" id="product">
  <h2>我们的产品</h2>
  <p class="intro">点击进入对应项目了解更多内容。</p>
  <div class="product-list" id="productList"></div>
</section>

<!-- 社交 -->
<section class="social" id="social">
  <h2>关注我们</h2>
  <div class="social-icons">
    <a href="https://www.douyin.com/" target="_blank" rel="noopener" title="抖音">
      <svg class="icon-douyin" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.83a8.16 8.16 0 0 0 4.77 1.52V6.9a4.85 4.85 0 0 1-1.84-.21z"/></svg>
    </a>
    <a href="https://www.kuaishou.com/" target="_blank" rel="noopener" title="快手">
      <svg class="icon-kuaishou" viewBox="0 0 24 24"><path d="M4 4h3l1.2 4.2A7.96 7.96 0 0 1 12 4a8 8 0 1 1-8 8V7.5l-3 .5v-4zm7 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
    </a>
    <a href="https://www.bilibili.com/" target="_blank" rel="noopener" title="哔哩哔哩">
      <svg class="icon-bili" viewBox="0 0 24 24"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-.213-.429a3.27 3.27 0 0 1-.027-.063 2.63 2.63 0 0 1-.065-.151l-.03-.068a2.639 2.639 0 0 1-.095-.204 1.914 1.914 0 0 1-.046-.1c-.03-.072-.062-.145-.088-.218a.869.869 0 0 1-.034-.105v-.027a.816.816 0 0 1-.028-.114c-.006-.048-.012-.096-.012-.144s.006-.096.012-.144a.772.772 0 0 1 .028-.114v-.027c.012-.036.022-.069.034-.105l.088-.218c.024-.072.055-.145.095-.204a2.387 2.387 0 0 1 .065-.151l.03-.068c.027-.063.055-.12.083-.18.028-.06.057-.12.087-.18l.214-.429H7.22c.486.12.812.426 1.026.903.216.477.246.96.12 1.427-.12.485-.4.801-.81 1.026-.408.216-.852.24-1.26.12l-.48-.204-.18.42c-.12.283-.315.48-.6.6a.93.93 0 0 1-.42.084H3.653c-.66.024-1.213.236-1.65.636C1.567 9.208 1.356 9.764 1.333 10.42v7.36c.024.66.236 1.213.636 1.65.42.436.984.66 1.66.66h13.04c.676 0 1.23-.224 1.65-.66.4-.436.612-.99.636-1.65v-7.36c-.024-.66-.236-1.214-.636-1.65-.42-.436-.984-.66-1.66-.636zM7.66 15.46c0 .9-.295 1.647-.886 2.24-.59.591-1.327.886-2.207.886-.883 0-1.625-.295-2.22-.886-.591-.593-.886-1.34-.886-2.24 0-.883.295-1.625.886-2.2.595-.59 1.337-.886 2.22-.886.88 0 1.617.295 2.207.886.591.575.886 1.317.886 2.2zm9.44-4.12v2.28c0 .42-.153.773-.46 1.06-.306.288-.697.433-1.173.433-.475 0-.866-.145-1.173-.433-.306-.287-.46-.64-.46-1.06v-2.28c0-.42.153-.773.46-1.06.307-.288.698-.433 1.173-.433.476 0 .867.145 1.173.433.307.287.46.64.46 1.06zm.76 4.12c0 .9-.295 1.647-.886 2.24-.59.591-1.327.886-2.207.886-.883 0-1.625-.295-2.22-.886-.591-.593-.886-1.34-.886-2.24 0-.883.295-1.625.886-2.2.595-.59 1.337-.886 2.22-.886.88 0 1.617.295 2.207.886.591.575.886 1.317.886 2.2z"/></svg>
    </a>
  </div>
  <div class="scroll-hint" style="color:#9ca3af">向下滚动查看更多</div>
</section>

<!-- 备案 -->
<footer class="beian">
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">闽ICP备2026018137号</a>
  <img src="gongan.png" alt="公安备案" class="gongan-icon" onerror="this.style.display='none'" />
  <a href="https://beian.mps.gov.cn/#/query/webSearch?code=35070202100245" rel="nofollow noopener" target="_blank">闽公网安备35070202100245号</a>
</footer>

<script>
  fetch('team.json')
    .then(r => r.json())
    .then(data => {
      const grid = document.getElementById('teamGrid');
      data.forEach(m => {
        const div = document.createElement('div');
        div.className = 'member';
        div.innerHTML = `
          <div class="avatar">${m.name.charAt(0)}</div>
          <h3>${m.name}</h3>
          <div class="role">${m.role}</div>
          <p>${m.intro}</p>`;
        grid.appendChild(div);
      });
    })
    .catch(err => console.error('员工数据加载失败：', err));

  fetch('products.json')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('productList');
      data.forEach(p => {
        const a = document.createElement('a');
        a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
        a.innerHTML = `${p.title}<small>${p.desc}</small>`;
        list.appendChild(a);
      });
    })
    .catch(err => console.error('产品数据加载失败：', err));
</script>
<script src="https://shaofeng.littleapple.top/cookie/zh-cn/cookie-consent.js"></script>
</body>
</html>
