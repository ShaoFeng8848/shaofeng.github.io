<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QQ频道 · 删除帖子审计中心</title>
<style>
/* ==================== 背景层 ==================== */
.bg-layer {
  position: fixed;
  inset: 0;
  background: url("https://www.littleapple.top/1.jpg") center/cover no-repeat;
  filter: blur(14px);
  transform: scale(1.06);
  z-index: -2;
}
.bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(8, 10, 16, 0.58);
}

/* ==================== 全局 ==================== */
:root {
  --panel: rgba(23, 26, 33, 0.82);
  --line: #262b36;
  --text: #e6e8eb;
  --sub: #9aa3af;
  --primary: #4f8cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif;
  color: var(--text);
  min-height: 100vh;
}

/* ==================== 布局 ==================== */
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  border-right: 1px solid var(--line);
  padding: 24px 14px;
  flex-shrink: 0;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 28px;
  padding-left: 8px;
  background: linear-gradient(135deg, #4f8cff, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sidebar nav a {
  display: block;
  padding: 10px 14px;
  border-radius: 8px;
  color: var(--sub);
  cursor: pointer;
  margin-bottom: 4px;
  font-size: 14px;
}
.sidebar nav a.active,
.sidebar nav a:hover {
  background: rgba(79,140,255,0.15);
  color: var(--text);
}
.side-foot {
  margin-top: 40px;
  color: #555;
  font-size: 11px;
  text-align: center;
}

.main { flex: 1; padding: 24px 30px; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}
.title { font-size: 20px; font-weight: 600; }
.user {
  font-size: 13px;
  color: var(--sub);
  background: rgba(255,255,255,0.06);
  padding: 6px 14px;
  border-radius: 20px;
}

/* 卡片 */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.card {
  background: var(--panel);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 20px;
}
.card .k {
  color: var(--sub);
  font-size: 12px;
  letter-spacing: 1px;
}
.card .v {
  font-size: 26px;
  font-weight: 700;
  margin-top: 8px;
}
.card .v.blue { color: #4f8cff; }
.card .v.orange { color: #ffa657; }
.card .v.green { color: #3fb950; }
.card .v.red { color: #ff6b6b; }

/* 筛选 */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}
.filters input,
.filters select {
  background: rgba(27,31,39,0.8);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  outline: none;
}
.filters button {
  background: var(--primary);
  border: none;
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}
.filters button.reset { background: rgba(255,255,255,0.1); }

/* 表格 */
.table-wrap {
  background: var(--panel);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  text-align: left;
}
th {
  color: var(--sub);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
tr:hover td { background: rgba(79,140,255,0.05); }
td {
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.reason-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  background: rgba(255,107,107,0.15);
  color: #ff6b6b;
}

/* 分页 */
.pager {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 16px;
  justify-content: flex-end;
  border-top: 1px solid var(--line);
}
.pager button {
  background: rgba(34,40,54,0.9);
  color: var(--text);
  border: 1px solid var(--line);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}
.pager button:disabled { opacity: .4; cursor: not-allowed; }
#pageInfo { font-size: 13px; color: var(--sub); }

.empty-tip { text-align: center; padding: 60px 20px; color: var(--sub); }
.loading { text-align: center; padding: 60px 20px; color: var(--sub); }
</style>
</head>

<body>
<div class="bg-layer"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">🔍 QQ频道审计</div>
    <nav>
      <a class="active">📊 概览</a>
      <a>📋 删除日志</a>
      <a>⚙️ 字段设置</a>
    </nav>
    <div class="side-foot">v2.0 · inquire/</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title" id="viewTitle">删除帖子审计中心</div>
      <div class="user">👤 管理员</div>
    </header>

    <section class="cards" id="statCards">
      <div class="loading">加载中...</div>
    </section>

    <section class="filters">
      <input id="search" type="text" placeholder="🔍 搜索帖子 / 操作人 / 用户ID" />
      <select id="filterGuild"><option value="">全部频道</option></select>
      <select id="filterReason"><option value="">全部原因</option></select>
      <input type="date" id="filterDate" />
      <button id="resetFilter" class="reset">重置</button>
    </section>

    <section class="table-wrap">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="bodyRow"></tbody>
      </table>
      <div class="pager">
        <button id="prevPage">← 上一页</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPage">下一页 →</button>
      </div>
    </section>
  </main>
</div>

<script>
const state = {
  logs: [],
  columns: [],
  pageSize: 8,
  page: 1,
  sortKey: "",
  sortAsc: true,
  filter: { kw: "", guild: "", reason: "", date: "" }
};

async function loadJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("加载失败: " + url);
  return res.json();
}
function uniq(arr, key) {
  return [...new Set(arr.map(x => x[key]).filter(Boolean))];
}

function renderStats() {
  const box = document.getElementById("statCards");
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = state.logs.filter(l => l.time && l.time.startsWith(today)).length;
  const topOp = {};
  state.logs.forEach(l => { if (l.operator) topOp[l.operator] = (topOp[l.operator] || 0) + 1; });
  const topOperator = Object.entries(topOp).sort((a,b)=>b[1]-a[1])[0];
  const guildCount = uniq(state.logs, "guild").length;
  const reasonCount = {};
  state.logs.forEach(l => { if (l.reason) reasonCount[l.reason] = (reasonCount[l.reason]||0)+1; });
  const topReason = Object.entries(reasonCount).sort((a,b)=>b[1]-a[1])[0];

  box.innerHTML = `
    <div class="card"><div class="k">总删除数</div><div class="v blue">${state.logs.length}</div></div>
    <div class="card"><div class="k">今日删除</div><div class="v orange">${todayCount}</div></div>
    <div class="card"><div class="k">涉及频道</div><div class="v green">${guildCount}</div></div>
    <div class="card"><div class="k">高频原因</div><div class="v red">${topReason ? topReason[0] : "-"}</div></div>
  `;
}

function renderHead() {
  const tr = document.getElementById("headRow");
  tr.innerHTML = "";
  state.columns.forEach(col => {
    const th = document.createElement("th");
    th.innerHTML = col.label + (col.sortable ? ' <span style="opacity:.4">⇅</span>' : "");
    if (col.sortable) {
      th.onclick = () => {
        if (state.sortKey === col.key) state.sortAsc = !state.sortAsc;
        else { state.sortKey = col.key; state.sortAsc = true; }
        render();
      };
    }
    tr.appendChild(th);
  });
}

function process() {
  let data = state.logs.slice();
  const f = state.filter;
  if (f.kw) {
    const kw = f.kw.toLowerCase();
    data = data.filter(d => Object.values(d).some(v => v && String(v).toLowerCase().includes(kw)));
  }
  if (f.guild) data = data.filter(d => d.guild === f.guild);
  if (f.reason) data = data.filter(d => d.reason === f.reason);
  if (f.date) data = data.filter(d => d.time && d.time.startsWith(f.date));
  if (state.sortKey) {
    data.sort((a,b) => {
      const x = a[state.sortKey] || "";
      const y = b[state.sortKey] || "";
      return state.sortAsc ? String(x).localeCompare(String(y),"zh-CN") : String(y).localeCompare(String(x),"zh-CN");
    });
  }
  return data;
}

function render() {
  const data = process();
  const totalPage = Math.max(1, Math.ceil(data.length / state.pageSize));
  state.page = Math.min(Math.max(1, state.page), totalPage);
  const start = (state.page - 1) * state.pageSize;
  const slice = data.slice(start, start + state.pageSize);

  const tbody = document.getElementById("bodyRow");
  tbody.innerHTML = "";
  if (!slice.length) {
    tbody.innerHTML = `<tr><td colspan="${state.columns.length}"><div class="empty-tip">📭 没有匹配的日志</div></td></tr>`;
  } else {
    slice.forEach(row => {
      const tr = document.createElement("tr");
      state.columns.forEach(col => {
        const td = document.createElement("td");
        const val = row[col.key] || "-";
        if (col.key === "reason") td.innerHTML = `<span class="reason-tag">${val}</span>`;
        else { td.textContent = val; td.title = val; }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  document.getElementById("pageInfo").textContent = `${state.page} / ${totalPage}`;
  document.getElementById("prevPage").disabled = state.page <= 1;
  document.getElementById("nextPage").disabled = state.page >= totalPage;
}

(async function init() {
  try {
    const cfg = await loadJSON("./config.json");
    state.logs = await loadJSON("./logs.json");
    state.columns = cfg.columns || [];
    state.pageSize = cfg.pageSize || 8;
    document.getElementById("viewTitle").textContent = cfg.title || "删除帖子审计中心";

    renderStats();
    renderHead();

    uniq(state.logs, "guild").forEach(g => {
      const o = document.createElement("option");
      o.value = g; o.textContent = g;
      document.getElementById("filterGuild").appendChild(o);
    });
    uniq(state.logs, "reason").forEach(r => {
      const o = document.createElement("option");
      o.value = r; o.textContent = r;
      document.getElementById("filterReason").appendChild(o);
    });

    document.getElementById("search").oninput = e => { state.filter.kw = e.target.value.trim(); state.page = 1; render(); };
    document.getElementById("filterGuild").onchange = e => { state.filter.guild = e.target.value; state.page = 1; render(); };
    document.getElementById("filterReason").onchange = e => { state.filter.reason = e.target.value; state.page = 1; render(); };
    document.getElementById("filterDate").onchange = e => { state.filter.date = e.target.value; state.page = 1; render(); };
    document.getElementById("resetFilter").onclick = () => {
      state.filter = { kw:"", guild:"", reason:"", date:"" };
      document.getElementById("search").value = "";
      document.getElementById("filterGuild").value = "";
      document.getElementById("filterReason").value = "";
      document.getElementById("filterDate").value = "";
      state.page = 1; render();
    };
    document.getElementById("prevPage").onclick = () => { state.page--; render(); };
    document.getElementById("nextPage").onclick = () => { state.page++; render(); };

    render();
  } catch (err) {
    document.getElementById("statCards").innerHTML =
      `<div class="empty-tip">⚠️ 加载失败：${err.message}<br><br>请在 inquire/ 目录执行：<br>python -m http.server 8000<br>再访问 http://localhost:8000</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
