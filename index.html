        input, textarea, select {

        body::before {
            content: "";

    <script>
    (function() {
        const BAN_PAGE_URL = '../../webpage/banpage/ban.html';
        const BLOCKED_IPS_URL = './blocked_ips.json';
        let isBanTriggered = false;
        
        // 开发者工具检测函数
        function detectDevTools() {
            // 方法1: 检测窗口大小差异
            const widthThreshold = window.outerWidth - window.innerWidth > 160;
            const heightThreshold = window.outerHeight - window.innerHeight > 160;
            const sizeDetected = widthThreshold || heightThreshold;
            
            // 方法2: 使用debugger检测执行时间
            let debuggerDetected = false;
            const start = Date.now();
            debugger;
            if (Date.now() - start > 100) {
                debuggerDetected = true;
            }
            
            // 方法3: 检测console方法是否被修改
            let consoleDetected = false;
            try {
                consoleDetected = !/native code/.test(window.console.log.toString());
            } catch(e) {}
            
            // 方法4: 检测Function.toString
            let functionDetected = false;
            try {
                functionDetected = Function.prototype.toString.call(window.console.log).indexOf('native') === -1;
            } catch(e) {}
            
            return sizeDetected || debuggerDetected || consoleDetected || functionDetected;
        }

        // 持续检测开发者工具
        function monitorDevTools() {
            if (detectDevTools()) {
                showBanWarning('检测到开发者工具已打开，这是不允许的操作');
                return;
            }
            
            // 每500毫秒检查一次
            setTimeout(monitorDevTools, 500);
        }
        
        function redirectToBanPage() {
            if (isBanTriggered) return;
            isBanTriggered = true;
            
            // 尝试正常跳转
            window.location.href = BAN_PAGE_URL;
            
            // 如果跳转失败，强制停止执行
            setTimeout(() => {
                if (document.visibilityState === 'visible') {
                    document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:50px;">安全违规检测</h1>';
                    document.body.style.backgroundColor = 'black';
                    window.stop();
                    throw new Error('Security violation detected');
                }
            }, 1000);
        }
        
        function showBanWarning(message) {
            if (isBanTriggered || !document.body) return;
            
            const warningHTML = `
                <div id="banWarning" style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-color: rgba(0,0,0,0.95);
                    z-index: 9999;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    color: white;
                    font-family: Arial, sans-serif;
                ">
                    <div style="
                        background-color: #333;
                        padding: 2rem;
                        border-radius: 8px;
                        max-width: 80%;
                        text-align: center;
                    ">
                        <h2>安全警告</h2>
                        <p>${message}</p>
                        <p>即将跳转到安全页面</p>
                        <div id="countdown" style="margin: 1rem 0; font-size: 1.5rem;">4</div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('afterbegin', warningHTML);
            
            let count = 4;
            const countdown = setInterval(() => {
                count--;
                document.getElementById('countdown').textContent = count;
                if (count <= 0) {
                    clearInterval(countdown);
                    redirect极BanPage();
                }
            }, 1000);
        }
        
        // 检查IP是否在CIDR范围内
        function isIPInCIDR(ip, subnet, mask) {
            try {
                const ipToInt = ip => ip.split('.').reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0;
                const subnetInt = ipToInt(subnet);
                const ipInt = ipToInt(ip);
                const maskInt = ~((1 << (32 - mask)) - 1) >>> 0;
                return (subnetInt & maskInt) === (ipInt & maskInt);
            } catch(e) {
                return false;
            }
        }
        
        // 验证IP地址格式
        function isValidIP(ip) {
            if (!ip) return false;
            
            // 检查IPv4格式
            const ipv4Regex = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (ipv4Regex.test(ip)) {
                const parts = ip.split('.');
                return parts.every(part => {
                    const num = parseInt(part, 10);
                    return num >= 0 && num <= 255;
                });
            }
            
            return false;
        }
        
        async function getUserIP() {
            try {
                // 优先使用IPv4获取服务
                const response = await fetch('https://api.ipify.org?format=json');
                if (!response.ok) throw new Error('IP获取失败');
                
                const data = await response.json();
                const ip = data.ip;
                
                // 验证IP格式
                if (!isValidIP(ip)) {
                    console.warn('获取的IP格式无效:', ip);
                    return null;
                }
                
                return ip;
            } catch(e) {
                console.warn('从ipify获取IP失败:', e);
                
                // 备用方案：尝试其他服务
                const services = [
                    'https://api4.my-ip.io/ip.json',
                    'https://ipapi.co/json/',
                    'https://ipinfo.io/json'
                ];
                
                for (const url of services) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) continue;
                        
                        const data = await response.json();
                        if (data.ip && isValidIP(data.ip)) return data.ip;
                        if (data.query && isValidIP(data.query)) return data.query;
                    } catch(e) {
                        console.warn(`从 ${url} 获取IP失败:`, e);
                        continue;
                    }
                }
                
                return null;
            }
        }
        
        async function checkIPBlacklist(ip) {
            if (!ip) return { blocked: false };
            
            try {
                const response = await fetch(BLOCKED_IPS_URL);
                if (!response.ok) {
                    throw new Error('Failed to fetch IP blacklist');
                }
                const data = await response.json();
                
                for (const entry of data.blacklist) {
                    if (entry.cidr) {
                        // 处理CIDR表示法的IP范围
                        const [subnet, mask] = entry.ip.split('/');
                        if (isIPInCIDR(ip, subnet, parseInt(mask))) {
                            return {
                                blocked: true,
                                reason: entry.reason || "未知原因",
                                date: entry.date || "未知日期"
                            };
                        }
                    } else if (entry.ip === ip) {
                        return {
                            blocked: true,
                            reason: entry.reason || "未知原因",
                            date: entry.date || "未知日期"
                        };
                    }
                }
                return { blocked: false };
            } catch(e) {
                console.error("检查IP黑名单失败:", e);
                return { blocked: false };
            }
        }
        
        async function securityCheck() {
            if (/localhost|192\.168\.0\.109/.test(window.location.hostname) || window.location.protocol === 'file:') {
                return;
            }
            
            // 开始监控开发者工具
            monitorDevTools();
            
            // 禁用验证码按钮
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.classList.add('btn-disabled');
            sendBtn.disabled = true;
            
            const userIP = await getUserIP();
            
            // 如果无法获取有效IP，显示警告并跳转
            if (!userIP) {
                console.warn('无法获取有效的用户IP');
                showBanWarning('无法获取您的有效IP地址，请刷新页面重试');
                return;
            }
            
            const ipCheck = await checkIPBlacklist(userIP);
            
            if (ipCheck.blocked) {
                showBanWarning(`您的IP (${userIP}) 已被限制访问<br>原因: ${ipCheck.reason}`);
                return;
            }
            
            // 确保IP字段存在并设置值
            const ipField = document.getElementById('honeypot');
            if (ipField && userIP) {
                ipField.value = userIP;
            } else if (!ipField) {
                // 如果字段不存在，创建一个
                const form = document.getElementById('feedbackForm');
                if (form) {
                    const newIpField = document.createElement('input');
                    newIpField.type = 'hidden';
                    newIpField.id = 'honeypot';
                    newIpField.name = 'user_ip';
                    newIpField.value = userIP || '';
                    form.appendChild(newIpField);
                }
            }
            
            // 重新启用验证码按钮
            sendBtn.classList.remove('btn-disabled');
            sendBtn.disabled = false;
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', securityCheck);
        } else {
            securityCheck();
        }
    })();
    </script>

        // 获取Cookie值
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        // 设置Cookie
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${value};${expires};path=/`;
        }
        
        // 删除Cookie
        function deleteCookie(name) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;
        }
        
        // 获取每日发送次数
        function getDailySendCount() {
            const today = new Date().toDateString();
            const dailyData = getCookie('dailySendData');
            
            if (dailyData) {
                try {
                    const data = JSON.parse(dailyData);
                    if (data.date === today) {
                        return data.count;
                    }
                } catch (e) {
                    console.error('解析每日发送数据失败:', e);
                }
            }
            
            return 0;
        }
        
        // 更新每日发送次数
        function updateDailySendCount() {
            const today = new Date().toDateString();
            const currentCount = getDailySendCount();
            const newData = {
                date: today,
                count: currentCount + 1
            };
            
            setCookie('dailySendData', JSON.stringify(newData), 1);
            return newData.count;
        }

            const count = getDailySendCount();

            });

        function showModal(message) {
            const modal = document.getElementById('customModal');
            const modalMessage = document.getElementById('modalMessage');
            
            modalMessage.textContent = message;
            modal.style.display = 'flex';
            
            document.getElementById('modalCloseBtn').onclick = function() {
                modal.style.display = 'none';
            };
            
            modal.onclick = function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            };
        }

        function canClickButton() {
            const now = Date.now();
            
            if (isInCooldown) {
                showModal('系统正在处理您的请求，请稍后再试');
                return false;
            }
            
            if (now - lastClickTime < CONFIG.clickCooldown) {
                showModal('请勿频繁操作，请稍后再试');
                return false;
            }
            
            lastClickTime = now;
            return true;
        }

        function updateButtonStates() {
            const sendBtn = document.getElementById('sendBtn');
            const submitBtn = document.getElementById('submitBtn');
            
            // 检查Cookie中的冷却状态
            const lastSubmit = getCookie('lastSubmit');
            const isCoolingDown = lastSubmit && (Date.now() - parseInt(lastSubmit) < CONFIG.cooldown);
            
            isInCooldown = isCoolingDown;
            
            sendBtn.disabled = isCoolingDown;
            submitBtn.disabled = isCoolingDown;
            
            if (isCoolingDown) {
                sendBtn.classList.add('btn-disabled');
                submitBtn.classList.add('btn-disabled');
            } else {
                sendBtn.classList.remove('btn-disabled');
                submitBtn.classList.remove('btn-disabled');
            }
        }

        const validateEmail = (email) => {
            const domain = email.split('@')[1] || '';
            const isBlocked = blockedEmails.includes(email.toLowerCase());
            const isAllowed = CONFIG.allowedDomains.some(d => domain.endsWith(d));
            
            return {
                valid: !isBlocked && isAllowed,
                message: isBlocked ? '⚠️ 该邮箱已被限制使用' : 
                        !isAllowed ? `⚠️ 仅支持以下邮箱服务：${CONFIG.allowedDomains.join(', ')}` : ''
            };
        };

        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value.trim();
            const errorElement = document.getElementById('emailError');
            
            if (!email) {
                errorElement.style.display = 'none';
                this.classList.remove('invalid');
                return;
            }

            const validation = validateEmail(email);
            errorElement.textContent = validation.message;
            errorElement.style.display = validation.valid ? 'none' : 'block';
            this.classList.toggle('invalid', !validation.valid);
        });

        // 使用IPGeolocation API获取精确位置信息
        async function getLocationInfo(ip) {
            try {
                const response = await fetch(`${CONFIG.ipGeolocation.endpoint}?apiKey=${CONFIG.ipGeolocation.apiKey}&ip=${ip}`);
                const data = await response.json();
                
                if (data.country_name) {
                    let location = data.city || '';
                    if (data.state_prov) location += location ? `, ${data.state_prov}` : data.state_prov;
                    if (data.country_name) location += location ? `, ${data.country_name}` : data.country_name;
                    return location || '未知位置';
                }
                return '未知位置';
            } catch (error) {
                console.error('获取位置信息失败:', error);
                return '未知位置';
            }
        }

        // 发送验证码的实际逻辑
        async function sendVerificationCode() {
            const emailInput = document.getElementById('email');
            const nameInput = document.getElementById('name').value.trim();
            const email = emailInput.value.trim();
            const validation = validateEmail(email);
            
            if (!validation.valid) {
                emailInput.classList.add('invalid');
                showAlert('error', validation.message);
                return;
            }

            if (!nameInput) {
                showAlert('error', '请先输入您的称呼');
                return;
            }

            try {
                // 检查验证码发送冷却状态（使用Cookie）
                const lastCodeSend = getCookie('lastCodeSend');
                if (lastCodeSend && (Date.now() - parseInt(lastCodeSend) < 60000)) {
                    showAlert('error', '请等待60秒后再发送验证码');
                    return;
                }

                // 使用reCAPTCHA v3获取token
                const token = await new Promise((resolve, reject) => {
                    grecaptcha.ready(() => {
                        grecaptcha.execute(CONFIG.recaptcha.siteKey, {action: 'sendCode'})
                            .then(resolve)
                            .catch(reject);
                    });
                });

                const sendBtn = document.getElementById('sendBtn');
                sendBtn.classList.add('btn-disabled');
                sendBtn.disabled = true;
                
                const userIP = document.getElementById('honeypot').value;
                const locationInfo = await getLocationInfo(userIP);

                verificationData.codeData = generateSecureCode();
                verificationData.email = email;
                verificationData.timestamp = Date.now();
                
                await emailjs.send(
                    CONFIG.emailjs.serviceID,
                    CONFIG.emailjs.templateID, 
                    { 
                        to_email: email,
                        to_name: nameInput,
                        verification_code: verificationData.codeData.realCode,
                        fake_code: verificationData.codeData.fakeCode,
                        user_ip: userIP,
                        location_info: locationInfo,
                        recaptcha_token: token
                    }
                );

                // 更新每日发送次数
                const newCount = updateDailySendCount();
                console.log(`今日已发送 ${newCount} 次验证码`);
                
                // 设置验证码发送冷却Cookie（60秒）
                setCookie('lastCodeSend', Date.now().toString(), 1);
                
                startCodeTimer();
                showAlert('success', ' 验证码已发送至您的邮箱');
                
                // 重新启用按钮
                sendBtn.classList.remove('btn-disabled');
                sendBtn.disabled = false;
            } catch (error) {
                console.error('发送验证码错误:', error);
                showAlert('error', ` 发送失败: ${error.message}`);
                
                // 出错时也重新启用按钮
                const sendBtn = document.getElementById('sendBtn');
                sendBtn.classList.remove('btn-disabled');
                sendBtn.disabled = false;
            }
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            if (!canClickButton()) return;
            
            // 检查每日发送限制
            if (checkDailySendLimit()) {
                showAlert('error', '您的操作似乎符合轰炸邮件行为，为了保证防止垃圾邮件，请明天再试');
                return;
            }
            
            // 直接发送验证码（reCAPTCHA v3无需用户交互）
            sendVerificationCode();
        });

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!canClickButton()) return;
            
            try {
                // 保存原始按钮文本并显示加载状态
                const submitBtn = document.getElementById('submitBtn');
                originalSubmitBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';
                submitBtn.disabled = true;

                // 先进行reCAPTCHA验证
                const token = await new Promise((resolve, reject) => {
                    grecaptcha.ready(() => {
                        grecaptcha.execute(CONFIG.recaptcha.siteKey, {action: 'submitForm'})
                            .then(resolve)
                            .catch(reject);
                    });
                });

                const currentEmail = document.getElementById('email').value.trim();
                const currentCode = document.getElementById('code').value;

                const validations = [
                    { 
                        check: () => currentEmail !== verificationData.email, 
                        msg: '❌❌ 邮箱已被修改，请重新获取验证码' 
                    },
                    { 
                        check: () => !validateSecureCode(currentCode), 
                        msg: '❌❌ 验证码错误，请检查后重试' 
                    },
                    { 
                        check: () => Date.now() - verificationData.timestamp > CONFIG.codeExpire, 
                        msg: '⏳⏳⏳ 验证码已过期，请重新获取' 
                    },
                    { 
                        check: () => {
                            const lastSubmit = getCookie('lastSubmit');
                            return lastSubmit && Date.now() - parseInt(lastSubmit) < CONFIG.cooldown;
                        },
                        msg: '⏱⏱⏱ 24小时内只能提交一次反馈' 
                    }
                ];

                for (const { check, msg } of validations) {
                    if (check()) {
                        isInCooldown = true;
                        setTimeout(() => {
                            isInCooldown = false;
                            updateButtonStates();
                        }, CONFIG.clickCooldown);
                        
                        throw new Error(msg);
                    }
                }

                // 准备表单数据
                const formData = new FormData();
                formData.append('access_key', CONFIG.web3forms.accessKey);
                formData.append('name', document.getElementById('name').value.trim());
                formData.append('email', verificationData.email);
                formData.append('message', document.getElementById('message').value.trim());
                formData.append('user_ip', document.getElementById('honeypot').value);
                formData.append('recaptcha_token', token);

                // 发送请求
                const response = await fetch(CONFIG.web3forms.endpoint, {
                    method: 'POST',
                    body: formData
                });

                // 检查响应状态
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || '提交失败，请稍后重试');
                }

                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.message || '提交失败');
                }
                
                // 提交成功处理
                setCookie('lastSubmit', Date.now().toString(), 1);
                startCooldownTimer(CONFIG.cooldown);
                showAlert('success', '🎉🎉 提交成功！当我们接手时，您会收到一封工单号。这时请耐心等待我们客服回复您。');
                document.getElementById('feedbackForm').reset();
                
            } catch (error) {
                console.error('提交错误:', error);
                showAlert('error', `❌❌ ${error.message}`);
            } finally {
                // 恢复按钮状态
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.innerHTML = originalSubmitBtnText;
                submitBtn.disabled = false;
                updateButtonStates();
            }
        });

        const showAlert = (type, message) => {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i>
                ${message}
            `;
            document.getElementById('alerts').appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        };

        const startCodeTimer = () => {
            let seconds = 60;
            const timerDiv = document.getElementById('timer');
            const sendBtn = document.getElementById('sendBtn');
            
            sendBtn.disabled = true;
            sendBtn.classList.add('btn-disabled');
            timerDiv.style.display = 'block';
            
            codeTimer = setInterval(() => {
                timerDiv.textContent = `${seconds}秒后可重发-如果仍未收到邮件请检查垃圾邮件/广告邮件文件夹`;
                if (--seconds <= 0) {
                    clearInterval(codeTimer);
                    timerDiv.style.display = 'none';
                    sendBtn.disabled = isInCooldown;
                    sendBtn.classList.remove('btn-disabled');
                }
            }, 1000);
        };

        const startCooldownTimer = (duration) => {
            const timerDiv = document.getElementById('submitTimer');
            clearInterval(submitTimer);
            
            const updateTimer = () => {
                duration -= 1000;
                if (duration <= 0) {
                    timerDiv.style.display = 'none';
                    deleteCookie('lastSubmit');
                    isInCooldown = false;
                    updateButtonStates();
                    return;
                }
                
                const hours = Math.floor(duration / 3600000);
                const minutes = Math.floor((duration % 3600000) / 60000);
                const seconds = Math.floor((duration % 60000) / 1000);
                timerDiv.textContent = `下次可提交时间：${hours}时${minutes}分${seconds}秒`;
                timerDiv.style.display = 'block';
            };

            updateTimer();
            submitTimer = setInterval(updateTimer, 1000);
        };

        // 监听称呼输入框变化，启用/禁用验证码按钮
        document.getElementById('name').addEventListener('input', function() {
            const sendBtn = document.getElementById('sendBtn');
            const nameInput = this.value.trim();
            
            if (nameInput) {
                sendBtn.disabled = false;
                sendBtn.classList.remove('btn-disabled');
            } else {
                sendBtn.disabled = true;
                sendBtn.classList.add('btn-disabled');
            }
        });

        window.addEventListener('load', () => {
            const lastSubmit = getCookie('lastSubmit');
            if (lastSubmit) {
                const remaining = CONFIG.cooldown - (Date.now() - parseInt(lastSubmit));
                if (remaining > 0) {
                    startCooldownTimer(remaining);
                    isInCooldown = true;
                }
            }

            updateButtonStates();

            document.getElementById('backBtn').addEventListener('click', () => {
                window.location.href = CONFIG.pageUrls.home;
            });

            document.getElementById('faqBtn').addEventListener('click', () => {
                window.open(CONFIG.pageUrls.faq, '_blank');
            });
        });

        document.getElementById('feedbackForm').addEventListener('input', () => {
            if (isInCooldown) {
                const sendBtn = document.getElementById('sendBtn');
                const submitBtn = document.getElementById('submitBtn');
                sendBtn.disabled = true;
                submitBtn.disabled = true;
                sendBtn.classList.add('btn-disabled');
            }
        });
    </script>
    <script src="../../cookie/zh-cn/cookie-consent.js"></script>
</body>
